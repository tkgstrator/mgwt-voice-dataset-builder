name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo +1.88.0 fmt --all -- --check
      - name: Clippy
        run: cargo +1.88.0 clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo +1.88.0 test --all-targets --locked
      - name: Docs
        run: cargo +1.88.0 doc --no-deps --locked
