[package]
name = "mgwt-voice-dataset-builder"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Native Rust foundation for a locally authorized voice dataset builder"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hex = "0.4.3"
rustix = { version = "=1.1.5", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[dev-dependencies]
tempfile = "3.27.0"
trybuild = "1.0.122"
