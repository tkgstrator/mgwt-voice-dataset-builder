name: Deployment

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Require current default branch, valid version, and green Integration
        id: release
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SELECTED_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$SELECTED_REF" = "refs/heads/$DEFAULT_BRANCH"
          test "$(gh api "repos/$REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" --jq '.object.sha')" = "$COMMIT_SHA"

          version=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -er '.packages[] | select(.name == "mgwt-voice-dataset-builder") | .version')
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid Cargo SemVer: $version" >&2
            exit 1
          fi
          tag="v$version"

          tag_count=$(gh api "repos/$REPOSITORY/git/matching-refs/tags/$tag" \
            | jq --arg ref "refs/tags/$tag" '[.[] | select(.ref == $ref)] | length')
          release_count=$(gh release list --repo "$REPOSITORY" --limit 1000 --json tagName,isDraft \
            | jq --arg tag "$tag" '[.[] | select(.tagName == $tag)] | length')
          if [[ "$tag_count" -ne 0 || "$release_count" -ne 0 ]]; then
            echo "Release tag or release already exists; inspect it before retrying: $tag" >&2
            exit 1
          fi

          successful_runs=$(gh api \
            "repos/$REPOSITORY/actions/workflows/integration.yaml/runs?head_sha=$COMMIT_SHA&event=push&status=completed&per_page=100" \
            | jq --arg sha "$COMMIT_SHA" \
              '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | length')
          if [[ "$successful_runs" -lt 1 ]]; then
            echo "No successful Integration push run exists for $COMMIT_SHA" >&2
            exit 1
          fi
          echo "commit=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  package:
    name: Package ${{ matrix.artifact_name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            runner_os: Linux
            runner_arch: X64
            rust_host: x86_64-unknown-linux-gnu
            artifact_name: mgwt-voice-dataset-builder-linux-amd64
            extension: tar.gz
            executable: mgwt-voice-dataset-builder
          - os: ubuntu-24.04-arm
            runner_os: Linux
            runner_arch: ARM64
            rust_host: aarch64-unknown-linux-gnu
            artifact_name: mgwt-voice-dataset-builder-linux-arm64
            extension: tar.gz
            executable: mgwt-voice-dataset-builder
          - os: macos-15-intel
            runner_os: macOS
            runner_arch: X64
            rust_host: x86_64-apple-darwin
            artifact_name: mgwt-voice-dataset-builder-macos-amd64
            extension: tar.gz
            executable: mgwt-voice-dataset-builder
          - os: macos-15
            runner_os: macOS
            runner_arch: ARM64
            rust_host: aarch64-apple-darwin
            artifact_name: mgwt-voice-dataset-builder-macos-arm64
            extension: tar.gz
            executable: mgwt-voice-dataset-builder
          - os: windows-2025
            runner_os: Windows
            runner_arch: X64
            rust_host: x86_64-pc-windows-msvc
            artifact_name: mgwt-voice-dataset-builder-windows-amd64
            extension: zip
            executable: mgwt-voice-dataset-builder.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Verify native runner and toolchain
        shell: bash
        env:
          EXPECTED_OS: ${{ matrix.runner_os }}
          EXPECTED_ARCH: ${{ matrix.runner_arch }}
          EXPECTED_HOST: ${{ matrix.rust_host }}
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = "$EXPECTED_OS"
          test "$RUNNER_ARCH" = "$EXPECTED_ARCH"
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$EXPECTED_HOST"
      - name: Build and smoke test
        shell: bash
        env:
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          set -euo pipefail
          cargo build --release --locked
          ./target/release/"$EXECUTABLE" --help
      - name: Package binary and documentation
        if: runner.os != 'Windows'
        shell: bash
        env:
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
        run: |
          set -euo pipefail
          mkdir -p "staging/$ARTIFACT_NAME" dist
          install -m 0755 target/release/mgwt-voice-dataset-builder "staging/$ARTIFACT_NAME/"
          cp README.md LICENSE "staging/$ARTIFACT_NAME/"
          tar -czf "dist/$ARTIFACT_NAME.tar.gz" -C staging "$ARTIFACT_NAME"
      - name: Package Windows binary and documentation
        if: runner.os == 'Windows'
        shell: bash
        env:
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
        run: |
          set -euo pipefail
          mkdir -p "staging/$ARTIFACT_NAME" dist
          cp target/release/mgwt-voice-dataset-builder.exe README.md LICENSE "staging/$ARTIFACT_NAME/"
          python - "$ARTIFACT_NAME" <<'PY'
          import sys
          import zipfile

          artifact = sys.argv[1]
          names = ("mgwt-voice-dataset-builder.exe", "README.md", "LICENSE")
          with zipfile.ZipFile(f"dist/{artifact}.zip", "w", zipfile.ZIP_DEFLATED) as package:
              package.writestr(f"{artifact}/", b"")
              for name in names:
                  package.write(f"staging/{artifact}/{name}", f"{artifact}/{name}")
          PY
      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.${{ matrix.extension }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [prepare, package]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      COMMIT_SHA: ${{ needs.prepare.outputs.commit }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mgwt-voice-dataset-builder-*
          path: dist
          merge-multiple: true
          digest-mismatch: error
      - name: Verify exact packages and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_release_assets.py dist
          (
            cd dist
            sha256sum \
              mgwt-voice-dataset-builder-linux-amd64.tar.gz \
              mgwt-voice-dataset-builder-linux-arm64.tar.gz \
              mgwt-voice-dataset-builder-macos-amd64.tar.gz \
              mgwt-voice-dataset-builder-macos-arm64.tar.gz \
              mgwt-voice-dataset-builder-windows-amd64.zip > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
      - name: Recheck destination before publication
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" --jq '.object.sha')" = "$COMMIT_SHA"
          tag_count=$(gh api "repos/$REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" \
            | jq --arg ref "refs/tags/$RELEASE_TAG" '[.[] | select(.ref == $ref)] | length')
          release_count=$(gh release list --repo "$REPOSITORY" --limit 1000 --json tagName,isDraft \
            | jq --arg tag "$RELEASE_TAG" '[.[] | select(.tagName == $tag)] | length')
          if [[ "$tag_count" -ne 0 || "$release_count" -ne 0 ]]; then
            echo "Tag or release appeared during build; inspect before retrying: $RELEASE_TAG" >&2
            exit 1
          fi
      - name: Create and verify draft release
        id: draft
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            dist/mgwt-voice-dataset-builder-linux-amd64.tar.gz \
            dist/mgwt-voice-dataset-builder-linux-arm64.tar.gz \
            dist/mgwt-voice-dataset-builder-macos-amd64.tar.gz \
            dist/mgwt-voice-dataset-builder-macos-arm64.tar.gz \
            dist/mgwt-voice-dataset-builder-windows-amd64.zip \
            dist/SHA256SUMS \
            --repo "$REPOSITORY" \
            --target "$COMMIT_SHA" \
            --title "mgwt-voice-dataset-builder $RELEASE_TAG" \
            --generate-notes \
            --draft

          release_view=$(gh release view "$RELEASE_TAG" --repo "$REPOSITORY" \
            --json databaseId,isDraft,isPrerelease,tagName,targetCommitish)
          test "$(jq -r '.isDraft' <<< "$release_view")" = true
          test "$(jq -r '.isPrerelease' <<< "$release_view")" = false
          test "$(jq -r '.tagName' <<< "$release_view")" = "$RELEASE_TAG"
          test "$(jq -r '.targetCommitish' <<< "$release_view")" = "$COMMIT_SHA"
          release_id=$(jq -er '.databaseId' <<< "$release_view")
          release_json=$(gh api "repos/$REPOSITORY/releases/$release_id")
          test "$(jq -r '.draft' <<< "$release_json")" = true
          test "$(jq -r '.target_commitish' <<< "$release_json")" = "$COMMIT_SHA"
          test "$(gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$COMMIT_SHA"

          expected_assets=$(
            for asset in \
              dist/mgwt-voice-dataset-builder-linux-amd64.tar.gz \
              dist/mgwt-voice-dataset-builder-linux-arm64.tar.gz \
              dist/mgwt-voice-dataset-builder-macos-amd64.tar.gz \
              dist/mgwt-voice-dataset-builder-macos-arm64.tar.gz \
              dist/mgwt-voice-dataset-builder-windows-amd64.zip \
              dist/SHA256SUMS; do
              printf '%s %s sha256:%s\n' \
                "$(basename "$asset")" \
                "$(stat -c '%s' "$asset")" \
                "$(sha256sum "$asset" | cut -d ' ' -f 1)"
            done | sort
          )
          actual_assets=$(jq -r '.assets[] | "\(.name) \(.size) \(.digest)"' <<< "$release_json" | sort)
          if [[ "$actual_assets" != "$expected_assets" ]]; then
            echo "Draft release assets differ from verified local packages; left as draft" >&2
            exit 1
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
      - name: Publish and verify release
        shell: bash
        env:
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --repo "$REPOSITORY" --draft=false --latest
          release_json=$(gh api "repos/$REPOSITORY/releases/$RELEASE_ID")
          test "$(jq -r '.draft' <<< "$release_json")" = false
          test "$(jq -r '.prerelease' <<< "$release_json")" = false
          test "$(jq -r '.tag_name' <<< "$release_json")" = "$RELEASE_TAG"
          test "$(jq -r '.target_commitish' <<< "$release_json")" = "$COMMIT_SHA"
          test "$(jq '.assets | length' <<< "$release_json")" -eq 6
          test "$(gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$COMMIT_SHA"
