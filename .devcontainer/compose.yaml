name: mgwt-voice-dataset-builder

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../:/home/vscode/app:cached
      - target:/home/vscode/app/target
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
    environment:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    tty: true
    stdin_open: true

volumes:
  target:
  cargo-registry:
  cargo-git:
